name: Harness verification

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast deterministic gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run fast verification
        run: ./gradlew verifyFast --no-daemon

      - name: Upload fast verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fast-test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  mysql-integration:
    name: MySQL integration gate
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run MySQL integration verification
        run: ./gradlew integrationTest --no-daemon

      - name: Upload integration verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mysql-integration-test-report
          path: build/reports/tests/integrationTest
          if-no-files-found: ignore
          retention-days: 7
