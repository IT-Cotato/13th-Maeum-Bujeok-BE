name: Deploy to EC2

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean bootJar -x test

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/13th-Maeum-Bujeok-BE

            git pull origin deploy

            chmod +x gradlew
            ./gradlew clean bootJar -x test

            sudo fuser -k 8080/tcp || true
            sleep 3

            nohup java -Dfile.encoding=UTF-8 \
              -jar build/libs/backend-0.0.1-SNAPSHOT.jar \
              > /home/ubuntu/app.log 2>&1 &

            sleep 15

            if sudo lsof -i :8080 > /dev/null; then
              echo "배포 성공: 서버가 8080 포트에서 실행 중입니다."
            else
              echo "배포 실패: 애플리케이션 로그를 확인합니다."
              tail -100 /home/ubuntu/app.log
              exit 1
            fi
