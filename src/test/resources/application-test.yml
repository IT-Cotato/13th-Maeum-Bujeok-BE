spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:maumbujeok;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
  access-token-expiration: 30m
  refresh-token-expiration: 14d
  issuer: maumbujeok-test

# CoolSMS/Solapi 설정
coolsms:
  api-key: mock_coolsms_api_key
  api-secret: mock_coolsms_api_secret
  sender-number: 01000000000

