spring:
  application:
    name: backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 3307 포트와 allowPublicKeyRetrieval=true 확인!
    url: jdbc:mysql://localhost:3307/maumbujeok?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 500

# JWT 암호화 키
jwt:
  secret: ${JWT_SECRET}
