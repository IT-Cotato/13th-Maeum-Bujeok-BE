server:
  forward-headers-strategy: framework

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: backend

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
            scope:
              - email
              - profile

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 500

# JWT 설정
jwt:
  secret: ${JWT_SECRET:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:30m}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:14d}
  issuer: ${JWT_ISSUER:maumbujeok}

ai:
  provider: ${AI_PROVIDER:fake}
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-5.5}
    timeout: ${OPENAI_TIMEOUT:5s}
    max-attempts: ${OPENAI_MAX_ATTEMPTS:2}
  analysis:
    negative-threshold: ${AI_NEGATIVE_THRESHOLD:70}

storage:
  provider: ${STORAGE_PROVIDER:local}
  bucket: ${S3_BUCKET:}
  local-directory: ${STORAGE_LOCAL_DIRECTORY:build/local-uploads}
  upload-url-validity: ${STORAGE_UPLOAD_URL_VALIDITY:10m}
  download-url-validity: ${STORAGE_DOWNLOAD_URL_VALIDITY:10m}
  orphan-retention: ${STORAGE_ORPHAN_RETENTION:24h}
  cleanup-delay: ${STORAGE_CLEANUP_DELAY:1m}
logging:
  level:
    com.maumbujeok.backend.global.ai: ${AI_LOG_LEVEL:INFO}
    com.maumbujeok.backend.domain.diary: ${AI_LOG_LEVEL:INFO}

# CoolSMS/Solapi 설정
coolsms:
  api-key: ${COOLSMS_API_KEY}
  api-secret: ${COOLSMS_API_SECRET}
  sender-number: ${COOLSMS_SENDER_NUMBER}
