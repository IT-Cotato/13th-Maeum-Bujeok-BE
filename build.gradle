plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.maumbujeok'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	
	// Spring Security (보안 및 OAuth2)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // JWT (토큰)
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // Swagger (API 문서화)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

	// OAuth2 소셜 로그인을 위한 필수 라이브러리 추가
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	
    // dotenv (환경변수 자동 로드)
    implementation 'me.paulschwarz:spring-dotenv:5.0.1'

    // validation (유효성 검증)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // AWS S3 object storage
    implementation platform('software.amazon.awssdk:bom:2.32.26')
    implementation 'software.amazon.awssdk:s3'
    // Solapi SDK (SMS 발송)
    implementation 'com.solapi:sdk:1.0.3'

    // Actuator & Micrometer Prometheus
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'integration'
	}
	systemProperty 'spring.profiles.active', 'test'
}

tasks.register('integrationTest', Test) {
	description = 'Runs tests tagged as integration against real service containers.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'integration'
	}
	systemProperty 'spring.profiles.active', 'integration'
	shouldRunAfter tasks.named('test')
}

tasks.register('verifyFast') {
	description = 'Runs the deterministic, Docker-free feedback gate.'
	group = 'verification'
	dependsOn tasks.named('test')
}

tasks.register('verifyFull') {
	description = 'Runs the fast gate and MySQL integration tests.'
	group = 'verification'
	dependsOn tasks.named('check'), tasks.named('integrationTest')
}
